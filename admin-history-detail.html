```html
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin History</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#f2f2f2;
    font-family:Arial;
    margin:0;
}

.header{
    background:#fff;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

.filters{
    display:flex;
    gap:10px;
    padding:10px;
    flex-wrap:wrap;
}

select{
    flex:1;
    min-width:140px;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    background:#fff;
}

.card{
    background:#fff;
    margin:10px;
    padding:15px;
    border-radius:12px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.market{
    color:red;
    font-weight:bold;
}

.date{
    font-size:12px;
    color:#666;
    margin-top:5px;
}

.amount{
    background:red;
    color:#fff;
    padding:5px 10px;
    border-radius:6px;
}

.noData{
    text-align:center;
    padding:30px;
    color:#777;
}

</style>

</head>

<body>


<div class="header">
    Admin History
</div>


<!-- FILTERS -->

<div class="filters">

    <!-- REAL DATE -->
    <select id="dateFilter" onchange="filterData()">
        <option value="">All Date</option>
    </select>


    <!-- REAL MARKET -->
    <select id="marketFilter" onchange="filterData()">
        <option value="">All Market</option>
    </select>


    <!-- REAL AMOUNT -->
    <select id="amountFilter" onchange="filterData()">
        <option value="">All Amount</option>
    </select>

</div>


<div id="history"></div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const client = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


/* =====================================================
   FULL DATA
===================================================== */

let fullData = [];


/* =====================================================
   GET PARSED DATA
===================================================== */

function getParsedData(item){

    try{

        if(!item.data){
            return [];
        }

        let parsed =
            typeof item.data === "string"
            ? JSON.parse(item.data)
            : item.data;


        if(!Array.isArray(parsed)){
            parsed = [parsed];
        }


        return parsed;

    }catch(e){

        return [];

    }

}


/* =====================================================
   GET REAL AMOUNTS FROM HISTORY DATA
===================================================== */

function getAmounts(item){

    let parsed = getParsedData(item);

    let amounts = [];


    parsed.forEach(p=>{

        if(!p){
            return;
        }


        let amount =
            p.amount ??
            p.a ??
            p.value ??
            0;


        amount = Number(amount);


        if(!isNaN(amount) && amount > 0){

            amounts.push(amount);

        }

    });


    return amounts;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function getDateOnly(value){

    if(!value){
        return "";
    }


    let d = new Date(value);


    if(isNaN(d.getTime())){
        return "";
    }


    let year =
        d.getFullYear();


    let month =
        String(d.getMonth()+1)
        .padStart(2,"0");


    let day =
        String(d.getDate())
        .padStart(2,"0");


    return `${year}-${month}-${day}`;

}


/* =====================================================
   DISPLAY DATE
===================================================== */

function displayDate(date){

    if(!date){
        return "";
    }


    let parts =
        date.split("-");


    if(parts.length !== 3){
        return date;
    }


    return `${parts[2]}-${parts[1]}-${parts[0]}`;

}


/* =====================================================
   LOAD HISTORY
===================================================== */

async function loadHistory(){

    let {
        data,
        error
    } = await client

        .from("history")

        .select("*")

        .order("id",{
            ascending:false
        });


    if(error){

        console.log(error);

        document.getElementById("history").innerHTML =
            `<div class="noData">Data Load Error</div>`;

        return;

    }


    fullData = data || [];


    buildDateFilter();

    buildMarketFilter();

    buildAmountFilter();


    renderData(fullData);

}


/* =====================================================
   REAL DATE FILTER
===================================================== */

function buildDateFilter(){

    let dates = new Set();


    fullData.forEach(item=>{

        let date =
            getDateOnly(item.created_at);


        if(date){
            dates.add(date);
        }

    });


    let select =
        document.getElementById("dateFilter");


    select.innerHTML =
        `<option value="">All Date</option>`;


    [...dates]
        .sort((a,b)=>b.localeCompare(a))
        .forEach(date=>{

            let option =
                document.createElement("option");


            option.value = date;

            option.textContent =
                displayDate(date);


            select.appendChild(option);

        });

}


/* =====================================================
   REAL MARKET FILTER
===================================================== */

function buildMarketFilter(){

    let markets = new Set();


    fullData.forEach(item=>{

        if(item.market){

            markets.add(
                String(item.market)
            );

        }

    });


    let select =
        document.getElementById("marketFilter");


    select.innerHTML =
        `<option value="">All Market</option>`;


    [...markets]
        .sort()
        .forEach(market=>{

            let option =
                document.createElement("option");


            option.value = market;

            option.textContent = market;


            select.appendChild(option);

        });

}


/* =====================================================
   REAL AMOUNT FILTER
===================================================== */

function buildAmountFilter(){

    let amounts = new Set();


    fullData.forEach(item=>{

        let itemAmounts =
            getAmounts(item);


        itemAmounts.forEach(amount=>{

            amounts.add(amount);

        });

    });


    let select =
        document.getElementById("amountFilter");


    select.innerHTML =
        `<option value="">All Amount</option>`;


    [...amounts]
        .sort((a,b)=>a-b)
        .forEach(amount=>{

            let option =
                document.createElement("option");


            option.value = amount;

            option.textContent =
                "₹ " + amount;


            select.appendChild(option);

        });

}


/* =====================================================
   RENDER DATA
===================================================== */

function renderData(data){

    let html = "";


    data.forEach(item=>{

        let numbers = [];


        let parsed =
            getParsedData(item);


        parsed.forEach(p=>{

            if(!p){
                return;
            }


            let number =
                p.number ??
                p.num ??
                null;


            let amount =
                p.amount ??
                p.a ??
                p.value ??
                0;


            if(number === "TYPING"){
                return;
            }


            let num = "";


            if(p.type === "A"){

                num =
                    number + "×";

            }

            else if(p.type === "B"){

                num =
                    "×" + number;

            }

            else if(number !== null){

                num =
                    String(number)
                    .padStart(2,"0");

            }


            if(num !== ""){

                numbers.push({

                    number:num,

                    amount:
                        Number(amount) || 0

                });

            }

        });


        /* =========================================
           EVERY ENTRY
        ========================================= */

        numbers.forEach(n=>{

            html += `

            <div class="card">

                <div class="row">

                    <div class="market">
                        ${item.market ?? "-"}
                    </div>

                    <div class="amount">
                        ₹ ${n.amount}
                    </div>

                </div>


                <div>
                    User: ${item.user_id ?? "-"}
                    |
                    Bet No: ${n.number}
                </div>


                <div class="date">

                    ${new Date(
                        item.created_at
                    ).toLocaleString("en-IN")}

                </div>

            </div>

            `;

        });

    });


    document.getElementById("history").innerHTML =

        html ||

        `<div class="noData">
            No Data Found
        </div>`;

}


/* =====================================================
   FILTER DATA
===================================================== */

function filterData(){

    let dateVal =
        document.getElementById(
            "dateFilter"
        ).value;


    let marketVal =
        document.getElementById(
            "marketFilter"
        ).value;


    let amountVal =
        document.getElementById(
            "amountFilter"
        ).value;


    let filtered =
        fullData.filter(item=>{


            /* =====================================
               DATE
            ===================================== */

            if(dateVal){

                let itemDate =
                    getDateOnly(
                        item.created_at
                    );


                if(itemDate !== dateVal){

                    return false;

                }

            }


            /* =====================================
               MARKET
            ===================================== */

            if(marketVal){

                if(
                    String(item.market) !==
                    String(marketVal)
                ){

                    return false;

                }

            }


            /* =====================================
               REAL AMOUNT
            ===================================== */

            if(amountVal){

                let selectedAmount =
                    Number(amountVal);


                let amounts =
                    getAmounts(item);


                /*
                   अगर इस history record में
                   selected real amount मौजूद नहीं है
                   तो उसे hide कर देंगे.
                */

                let hasAmount =
                    amounts.some(amount =>

                        Number(amount) ===
                        selectedAmount

                    );


                if(!hasAmount){

                    return false;

                }

            }


            return true;

        });


    renderData(filtered);

}


/* =====================================================
   START
===================================================== */

loadHistory();


</script>

</body>
</html>
```
