<body>

<div class="filterBox">

<thead>

<th>Mobile</th>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const client = supabase.createClient(
    "https://katbdbzoufiblnnsoxkk.supabase.co",
    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"
);


/* =====================================================
   AUDIO
===================================================== */

let audio = new Audio(
    "https://www.soundjay.com/buttons/sounds/beep-07.mp3"
);


/* =====================================================
   DATA
===================================================== */

let deposits = [];
let withdraws = [];

let userDetailsCache = {};

let lastDepositCount = 0;
let lastWithdrawCount = 0;


/* =====================================================
   GET USER DETAILS
===================================================== */

async function getUserDetails(user_id){

    if(userDetailsCache[user_id]){
        return userDetailsCache[user_id];
    }

    let { data, error } = await client
        .from("login")
        .select("name,mobile")
        .eq("id", user_id)
        .maybeSingle();

    let result = data || {
        name:"-",
        mobile:"-"
    };

    userDetailsCache[user_id] = result;

    return result;
}


/* =====================================================
   LOAD DEPOSITS
===================================================== */

async function loadDeposits(){

    let { data, error } = await client
        .from("deposit_requests")
        .select("*")
        .order("id",{ascending:false});

    if(error){
        console.log("Deposit Error:",error);
        return;
    }

    deposits = data || [];

    for(let r of deposits){
        await getUserDetails(r.user_id);
    }

    buildFilters();

    applyFilters();
}


/* =====================================================
   LOAD WITHDRAW
===================================================== */

async function loadWithdraw(){

    let { data, error } = await client
        .from("withdraw_requests")
        .select("*")
        .order("id",{ascending:false});

    if(error){
        console.log("Withdraw Error:",error);
        return;
    }

    withdraws = data || [];

    for(let r of withdraws){
        await getUserDetails(r.user_id);
    }

    buildFilters();

    applyFilters();
}


/* =====================================================
   BUILD FILTER DROPDOWNS
===================================================== */

function buildFilters(){

    /* ================= USER IDs ================= */

    let ids = new Set();

    deposits.forEach(r=>{
        if(r.user_id !== null && r.user_id !== undefined){
            ids.add(String(r.user_id));
        }
    });

    withdraws.forEach(r=>{
        if(r.user_id !== null && r.user_id !== undefined){
            ids.add(String(r.user_id));
        }
    });

    let userSelect = document.getElementById("userFilter");

    let currentUser = userSelect.value;

    userSelect.innerHTML =
        '<option value="all">All User ID</option>';

    [...ids]
        .sort((a,b)=>Number(a)-Number(b))
        .forEach(id=>{

            let option = document.createElement("option");

            option.value = id;
            option.textContent = id;

            userSelect.appendChild(option);
        });

    if([...ids].includes(currentUser)){
        userSelect.value = currentUser;
    }


    /* ================= DATES ================= */

    let dates = new Set();

    deposits.forEach(r=>{
        let d = getDateOnly(r.created_at);

        if(d){
            dates.add(d);
        }
    });

    withdraws.forEach(r=>{
        let d = getDateOnly(r.created_at);

        if(d){
            dates.add(d);
        }
    });

    let dateSelect = document.getElementById("dateFilter");

    let currentDate = dateSelect.value;

    dateSelect.innerHTML =
        '<option value="all">All Date</option>';

    [...dates]
        .sort((a,b)=>b.localeCompare(a))
        .forEach(date=>{

            let option = document.createElement("option");

            option.value = date;
            option.textContent = formatDate(date);

            dateSelect.appendChild(option);
        });

    if([...dates].includes(currentDate)){
        dateSelect.value = currentDate;
    }
}


/* =====================================================
   GET DATE ONLY
===================================================== */

function getDateOnly(dateValue){

    if(!dateValue){
        return "";
    }

    let d = new Date(dateValue);

    if(isNaN(d.getTime())){
        return "";
    }

    let year = d.getFullYear();

    let month = String(
        d.getMonth()+1
    ).padStart(2,"0");

    let day = String(
        d.getDate()
    ).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

    if(!date){
        return "-";
    }

    let parts = date.split("-");

    if(parts.length !== 3){
        return date;
    }

    return `${parts[2]}-${parts[1]}-${parts[0]}`;
}


/* =====================================================
   FORMAT DATE TIME
===================================================== */

function formatDateTime(value){

    if(!value){
        return "-";
    }

    let d = new Date(value);

    if(isNaN(d.getTime())){
        return value;
    }

    return d.toLocaleString("en-IN",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });
}


/* =====================================================
   APPLY ALL FILTERS
===================================================== */

function applyFilters(){

    let type =
        document.getElementById("typeFilter").value;

    let status =
        document.getElementById("statusFilter").value;

    let date =
        document.getElementById("dateFilter").value;

    let user =
        document.getElementById("userFilter").value;


    /* ================= DEPOSIT ================= */

    let filteredDeposits = deposits.filter(r=>{

        if(type === "withdraw"){
            return false;
        }

        if(status !== "all"){

            if(status === "pending" &&
               r.status !== "pending"){
                return false;
            }

            if(status === "approved" &&
               r.status !== "approved"){
                return false;
            }

            if(status === "cancelled" &&
               r.status !== "cancelled"){
                return false;
            }
        }

        if(date !== "all"){

            if(getDateOnly(r.created_at) !== date){
                return false;
            }
        }

        if(user !== "all"){

            if(String(r.user_id) !== String(user)){
                return false;
            }
        }

        return true;
    });


    /* ================= WITHDRAW ================= */

    let filteredWithdraws = withdraws.filter(r=>{

        if(type === "deposit"){
            return false;
        }

        if(status !== "all"){

            if(status === "pending" &&
               r.status !== "pending"){
                return false;
            }

            if(status === "approved" &&
               r.status !== "approved"){
                return false;
            }

            if(status === "cancelled" &&
               r.status !== "cancelled"){
                return false;
            }
        }

        if(date !== "all"){

            if(getDateOnly(r.created_at) !== date){
                return false;
            }
        }

        if(user !== "all"){

            if(String(r.user_id) !== String(user)){
                return false;
            }
        }

        return true;
    });


    renderDeposits(filteredDeposits);

    renderWithdraws(filteredWithdraws);
}


/* =====================================================
   RENDER DEPOSIT
===================================================== */

function renderDeposits(data){

    let html = "";

    if(data.length === 0){

        html = `
        <tr>
            <td colspan="9" class="empty">
                No Deposit Found
            </td>
        </tr>`;

        document.getElementById("depositData").innerHTML = html;

        return;
    }


    data.forEach(r=>{

        let userInfo =
            userDetailsCache[r.user_id] || {
                name:"-",
                mobile:"-"
            };


        let action = "";

        if(r.status === "approved"){

            action =
            `<span class="done">✔ Approved</span>`;

        }
        else if(r.status === "cancelled"){

            action =
            `<span class="cancelled">
                ❌ Cancelled
            </span>`;

        }
        else{

            action = `
            <button
                class="approve"
                onclick="approveDeposit(
                    ${r.id},
                    ${r.user_id},
                    ${r.amount || 0}
                )">
                Approve
            </button>

            <button
                class="cancel"
                onclick="cancelDeposit(${r.id})">
                Cancel
            </button>`;
        }


        let screenshot = "-";

        if(r.screenshot){

            let url =
                r.screenshot.toString().trim();

            if(url.includes("http")){

                screenshot =
                `<img src="${url}"
                      onclick="window.open('${url}')">`;

            }
        }


        html += `
        <tr>

            <td>${r.id}</td>

            <td>${r.user_id}</td>

            <td>${userInfo.name}</td>

            <td>${userInfo.mobile}</td>

            <td>${r.amount ?? 0}</td>

            <td>${screenshot}</td>

            <td>${r.status || "-"}</td>

            <td>${formatDateTime(r.created_at)}</td>

            <td>${action}</td>

        </tr>`;
    });


    document.getElementById("depositData").innerHTML = html;
}


/* =====================================================
   RENDER WITHDRAW
===================================================== */

function renderWithdraws(data){

    let html = "";

    if(data.length === 0){

        html = `
        <tr>
            <td colspan="9" class="empty">
                No Withdraw Found
            </td>
        </tr>`;

        document.getElementById("withdrawData").innerHTML = html;

        return;
    }


    data.forEach(r=>{

        let userInfo =
            userDetailsCache[r.user_id] || {
                name:"-",
                mobile:"-"
            };


        let action = "";

        if(r.status === "approved"){

            action =
            `<span class="done">
                ✔ Approved
            </span>`;

        }
        else if(r.status === "cancelled"){

            action =
            `<span class="cancelled">
                ❌ Cancelled
            </span>`;

        }
        else{

            action = `
            <button
                class="approve"
                onclick="approveWithdraw(${r.id})">
                Approve
            </button>

            <button
                class="cancel"
                onclick="cancelWithdraw(${r.id})">
                Cancel
            </button>`;
        }


        let details = "-";


        if(r.screenshot){

            let url =
                r.screenshot.toString().trim();

            if(url.includes("http")){

                details =
                `<img src="${url}"
                      onclick="window.open('${url}')">`;

            }
            else{

                details = url;
            }
        }

        else if(r.upi){

            details = r.upi;
        }


        html += `
        <tr>

            <td>${r.id}</td>

            <td>${r.user_id}</td>

            <td>${userInfo.name}</td>

            <td>${userInfo.mobile}</td>

            <td>${r.amount ?? 0}</td>

            <td>${details}</td>

            <td>${r.status || "-"}</td>

            <td>${formatDateTime(r.created_at)}</td>

            <td>${action}</td>

        </tr>`;
    });


    document.getElementById("withdrawData").innerHTML = html;
}


/* =====================================================
   APPROVE DEPOSIT
===================================================== */

async function approveDeposit(id,user_id,amount){

    let { data: check, error } = await client
        .from("deposit_requests")
        .select("status")
        .eq("id",id)
        .single();


    if(error){

        alert("Request check failed");

        console.log(error);

        return;
    }


    if(check.status === "approved"){

        alert("Already Approved");

        return;
    }


    if(check.status === "cancelled"){

        alert("This request is already cancelled");

        return;
    }


    let { error:updateError } = await client
        .from("deposit_requests")
        .update({
            status:"approved"
        })
        .eq("id",id);


    if(updateError){

        alert("Deposit status update failed");

        console.log(updateError);

        return;
    }


    let { data, error:balanceError } = await client
        .from("login")
        .select("balance")
        .eq("id",user_id)
        .single();


    if(balanceError){

        alert("User balance read failed");

        console.log(balanceError);

        return;
    }


    let newBalance =
        (Number(data.balance) || 0) +
        (Number(amount) || 0);


    let { error:loginError } = await client
        .from("login")
        .update({
            balance:newBalance
        })
        .eq("id",user_id);


    if(loginError){

        alert("Balance update failed");

        console.log(loginError);

        return;
    }


    audio.play().catch(()=>{});

    alert("Deposit Approved ✅");

    await loadDeposits();
}


/* =====================================================
   CANCEL DEPOSIT
===================================================== */

async function cancelDeposit(id){

    let { error } = await client
        .from("deposit_requests")
        .update({
            status:"cancelled"
        })
        .eq("id",id);


    if(error){

        alert("Cancel failed");

        console.log(error);

        return;
    }


    await loadDeposits();
}


/* =====================================================
   APPROVE WITHDRAW
===================================================== */

async function approveWithdraw(id){

    let { error } = await client
        .from("withdraw_requests")
        .update({
            status:"approved"
        })
        .eq("id",id);


    if(error){

        alert("Withdraw approve failed");

        console.log(error);

        return;
    }


    audio.play().catch(()=>{});

    alert("Withdraw Approved ✅");

    await loadWithdraw();
}


/* =====================================================
   CANCEL WITHDRAW
===================================================== */

async function cancelWithdraw(id){

    let { error } = await client
        .from("withdraw_requests")
        .update({
            status:"cancelled"
        })
        .eq("id",id);


    if(error){

        alert("Cancel failed");

        console.log(error);

        return;
    }


    await loadWithdraw();
}


/* =====================================================
   CHECK NEW REQUESTS
===================================================== */

async function checkNewRequests(){

    let { data: dep } =
        await client
        .from("deposit_requests")
        .select("id");


    let { data: wid } =
        await client
        .from("withdraw_requests")
        .select("id");


    dep = dep || [];
    wid = wid || [];


    if(
        lastDepositCount === 0 &&
        lastWithdrawCount === 0
    ){

        lastDepositCount = dep.length;

        lastWithdrawCount = wid.length;

        return;
    }


    if(dep.length > lastDepositCount){

        audio.play().catch(()=>{});

        alert("New Deposit 🔥");

        await loadDeposits();
    }


    if(wid.length > lastWithdrawCount){

        audio.play().catch(()=>{});

        alert("New Withdraw 🔥");

        await loadWithdraw();
    }


    lastDepositCount = dep.length;

    lastWithdrawCount = wid.length;
}


/* =====================================================
   AUTO CHECK EVERY 5 SECONDS
===================================================== */

setInterval(
    checkNewRequests,
    5000
);


/* =====================================================
   FIRST LOAD
===================================================== */

loadDeposits();

loadWithdraw();


/* =====================================================
   HASH FILTER
   #deposit
   #withdraw
===================================================== */

window.addEventListener("load",()=>{

    let hash =
        window.location.hash;


    if(hash === "#deposit"){

        document.getElementById(
            "withdraw"
        ).style.display = "none";

        document.getElementById(
            "typeFilter"
        ).value = "deposit";

        applyFilters();
    }


    if(hash === "#withdraw"){

        document.getElementById(
            "deposit"
        ).style.display = "none";

        document.getElementById(
            "typeFilter"
        ).value = "withdraw";

        applyFilters();
    }

});

</script>

</body>
</html>
